name: .NET Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: your-solution-name                         # Replace with your solution name, i.e. MyWpfApp.sln.
      Test_Project_Path: your-test-project-path                 # Replace with the path to your test project, i.e. MyWpfApp.Tests\MyWpfApp.Tests.csproj.
      Wap_Project_Directory: your-wap-project-directory-name    # Replace with the Wap project directory relative to the solution, i.e. MyWpfApp.Package.
      Wap_Project_Path: your-wap-project-path                   # Replace with the path to your Wap project, i.e. MyWpf.App.Package\MyWpfApp.Package.wapproj.

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Self-contained: users don't need a .NET runtime installed
    - name: Build app
      run: dotnet publish LegoTrainProject.csproj -c ${{ matrix.configuration }} -r win-x64 --self-contained true -o out\${{ matrix.configuration }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: files_${{ matrix.configuration }}
        path: 'out\${{ matrix.configuration }}\**'
        
    - name: Zip Files
      if: github.ref == 'refs/heads/master' && matrix.configuration == 'Release'
      uses: vimtor/action-zip@v1.2
      with:
        files: out/Release/
        recursive: true
        dest: LegoTrainProject.zip

    - name: Read version
      id: version
      if: matrix.configuration == 'Release'
      shell: pwsh
      run: |
        $m = Select-String -Path Properties\AssemblyInfo.cs -Pattern 'AssemblyVersion\("([0-9.]+)"\)'
        "version=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

    - name: Build installer
      if: matrix.configuration == 'Release'
      shell: pwsh
      run: |
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
          "/DMyAppVersion=${{ steps.version.outputs.version }}" `
          "/DBuildDir=..\out\Release" `
          installer\BAP.iss

    - name: Upload Installer
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: BAP_Setup
        path: installer\Output\*.exe

    - name: Create Prerelease
      if: github.ref == 'refs/heads/master' && matrix.configuration == 'Release'
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: true
        automatic_release_tag: "ci_win"
        title: "BAP ${{ steps.version.outputs.version }}"
        files: |
          LegoTrainProject.zip
          installer/Output/*.exe
